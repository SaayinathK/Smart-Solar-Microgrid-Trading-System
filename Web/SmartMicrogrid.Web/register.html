<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Microgrid Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="glass-card auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <h2>Create Prosumer Account</h2>
        <p>Join the local solar microgrid energy network</p>
      </div>

      <div id="alert-box" class="alert alert-danger"></div>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="firstName">First Name</label>
            <input type="text" id="firstName" class="form-control" placeholder="John" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="lastName">Last Name</label>
            <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john.doe@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" class="form-control" placeholder="+1234567890">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 chars" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-type password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Register Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      &copy; 2026 Smart Microgrid Platform
    </div>
  </footer>

  <script src="js/config/api-config.js"></script>
  <script src="js/common/session.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/auth-api.js"></script>
  <script src="js/common/auth.js"></script>
  <script src="js/common/navbar.js"></script>
  <script>
    AuthGuard.redirectIfAuthenticated();
    renderNavbar();

    const registerForm = document.getElementById('register-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.remove('active');

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Creating Account...';

      try {
        const response = await AuthApi.register({
          firstName,
          lastName,
          email,
          phoneNumber,
          password,
          confirmPassword
        });

        if (response.success) {
          ApiClient.showToast('Registration successful! Please sign in with your email.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showError(response.message || 'Registration failed.');
        }
      } catch (err) {
        showError(err.message || 'Error communicating with server.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Register Account';
      }
    });

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.classList.add('active');
    }
  </script>
</body>
</html>
