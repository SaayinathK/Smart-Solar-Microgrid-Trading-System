<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Details - Smart Microgrid</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <style>
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .detail-item {
      background: rgba(11, 15, 25, 0.4);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .detail-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .detail-value {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.25rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container" style="max-width: 900px;">
      
      <div class="page-header">
        <div class="page-title">
          <h1>User Account Details</h1>
          <p>MongoDB Document ID & System Information</p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <a href="users.html" class="btn btn-secondary">← Back to Users</a>
          <a id="edit-user-btn" href="#" class="btn btn-primary">Edit Account</a>
        </div>
      </div>

      <div id="details-card" class="glass-card">
        <div style="text-align: center; color: var(--text-muted); padding: 3rem;">
          Loading user details...
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      &copy; 2026 Smart Microgrid Platform
    </div>
  </footer>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/user-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/navbar.js"></script>
  <script src="../../js/users/user-details.js"></script>
</body>
</html>
