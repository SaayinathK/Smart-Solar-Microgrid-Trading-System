<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User - Smart Microgrid Platform</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container" style="max-width: 680px;">
      
      <div class="page-header">
        <div class="page-title">
          <h1 id="page-heading">Edit User Account</h1>
          <p>Update personal information, role, status, or password</p>
        </div>
        <div>
          <a href="users.html" class="btn btn-secondary">← Back</a>
        </div>
      </div>

      <div class="glass-card">
        <div id="alert-box" class="alert alert-danger"></div>

        <form id="edit-user-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="firstName">First Name *</label>
              <input type="text" id="firstName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last Name *</label>
              <input type="text" id="lastName" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address (Read-only)</label>
            <input type="email" id="email" class="form-control" disabled style="opacity: 0.7;">
          </div>

          <div class="form-group">
            <label class="form-label" for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" class="form-control">
          </div>

          <div id="admin-fields-container" class="form-row" style="display: none;">
            <div class="form-group">
              <label class="form-label" for="role">System Role *</label>
              <select id="role" class="form-select">
                <option value="Prosumer">Prosumer</option>
                <option value="MicrogridOperator">Microgrid Operator</option>
                <option value="TransactionVerifier">Transaction Verifier</option>
                <option value="Admin">System Administrator</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="isActive">Account Status *</label>
              <select id="isActive" class="form-select">
                <option value="true">Active Account</option>
                <option value="false">Inactive Account</option>
              </select>
            </div>
          </div>

          <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <button type="submit" id="btn-submit" class="btn btn-primary">Save Profile Changes</button>
          </div>
        </form>
      </div>

      <!-- Optional Change Password Card -->
      <div class="glass-card" style="margin-top: 2rem;">
        <h3 style="margin-bottom: 1rem; font-size: 1.2rem;">Change Password</h3>
        <div id="pwd-alert-box" class="alert alert-danger"></div>

        <form id="change-pwd-form">
          <div class="form-group">
            <label class="form-label" for="currentPassword">Current Password *</label>
            <input type="password" id="currentPassword" class="form-control" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="newPassword">New Password *</label>
              <input type="password" id="newPassword" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmNewPassword">Confirm New Password *</label>
              <input type="password" id="confirmNewPassword" class="form-control" required minlength="6">
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end;">
            <button type="submit" id="btn-pwd-submit" class="btn btn-secondary">Update Password</button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      &copy; 2026 Smart Microgrid Platform
    </div>
  </footer>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/auth-api.js"></script>
  <script src="../../js/api/user-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/navbar.js"></script>
  <script src="../../js/users/edit-user.js"></script>
</body>
</html>
