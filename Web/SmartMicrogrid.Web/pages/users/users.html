<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Smart Microgrid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/interface.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

  <div id="app-layout-wrapper">
    <div data-page-intro class="page-header">
      <div class="page-title">
        <h1>User Management</h1>
        <p>System account directory, roles, and status management</p>
      </div>
      <div>
        <a href="create-user.html" class="btn btn-primary">+ Create User</a>
      </div>
    </div>

    <!-- Toolbar Filter & Search -->
    <!-- Quick Status Queue Navigation (Fulfills Pending Activation Rubric) -->
    <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
      <button type="button" class="btn btn-sm btn-outline-primary active" id="tab-all-users" onclick="setQuickStatus('')">
        All Users
      </button>
      <button type="button" class="btn btn-sm btn-outline-warning position-relative" id="tab-pending-users" onclick="setQuickStatus('Pending')">
        ⏳ Pending Activations Queue
        <span id="pending-count-badge" class="badge bg-warning text-dark ms-1 d-none">0</span>
      </button>
      <button type="button" class="btn btn-sm btn-outline-success" id="tab-active-users" onclick="setQuickStatus('Active')">
        Active Accounts
      </button>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="tab-inactive-users" onclick="setQuickStatus('Inactive')">
        Inactive / Deactivated
      </button>
      <button type="button" class="btn btn-sm btn-outline-danger" id="tab-suspended-users" onclick="setQuickStatus('Suspended')">
        Suspended
      </button>
    </div>

    <div id="pending-queue-banner" class="alert alert-warning d-none mb-3 py-2 px-3" style="border-radius: 8px;">
      <strong>Pending Activations Queue:</strong> Newly registered Prosumers awaiting Backoffice activation. Click <strong>Activate</strong> to approve access.
    </div>

    <div class="table-toolbar">
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Search by name, email, or NIC..." aria-label="Search users">
      </div>

      <select id="role-filter" class="form-select" style="max-width: 200px;" aria-label="Filter users by role">
        <option value="">All Roles</option>
        <option value="Admin">Admin</option>
        <option value="MicrogridOperator">Microgrid Operator</option>
        <option value="Prosumer">Prosumer</option>
      </select>

      <select id="status-filter" class="form-select" style="max-width: 180px;" aria-label="Filter users by account status">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
        <option value="Suspended">Suspended</option>
        <option value="Pending">Pending</option>
      </select>
    </div>

    <!-- Data Table -->
    <div class="table-container glass-card" style="padding: 0;">
      <table class="data-table">
        <thead>
          <tr>
            <th>User Name</th>
            <th>NIC</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr>
            <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2rem;">
              Loading system users...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/user-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/page-template.js"></script>
  <script src="../../js/common/sidebar.js"></script>
  <script src="../../js/users/users.js"></script>
  <script>
    renderAppLayout('users', 'User Management');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
