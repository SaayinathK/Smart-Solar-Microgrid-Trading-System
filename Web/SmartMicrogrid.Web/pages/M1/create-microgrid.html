<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Microgrid - Smart Microgrid Platform</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/forms.css">
</head>
<body>

  <div id="app-layout-wrapper">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <div style="margin-bottom: 1.5rem;">
        <h2>Register Solar Microgrid Node</h2>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">
          Configure new solar generation node parameters, GPS coordinates, generation capacity, and battery storage.
        </p>
      </div>

      <form id="create-microgrid-form" onsubmit="handleCreate(event)">
        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Microgrid Node Name *</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Colombo Solar Hub Alpha" required>
          </div>

          <div class="form-group">
            <label class="form-label">Location / City *</label>
            <input type="text" id="location" class="form-control" placeholder="e.g. Colombo 03" required>
          </div>

          <div class="form-group">
            <label class="form-label">Status *</label>
            <select id="status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Maintenance">Maintenance</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">GPS Latitude (-90 to 90) *</label>
            <input type="number" step="0.0001" id="latitude" class="form-control" value="6.9271" required>
          </div>

          <div class="form-group">
            <label class="form-label">GPS Longitude (-180 to 180) *</label>
            <input type="number" step="0.0001" id="longitude" class="form-control" value="79.8612" required>
          </div>

          <div class="form-group">
            <label class="form-label">Generation Capacity (kWh) *</label>
            <input type="number" step="0.1" id="capacity" class="form-control" placeholder="e.g. 500" required>
          </div>

          <div class="form-group">
            <label class="form-label">Battery Capacity (kWh) *</label>
            <input type="number" step="0.1" id="batteryCapacity" class="form-control" placeholder="e.g. 200" required>
          </div>

          <div class="form-group">
            <label class="form-label">Initial Battery Level (kWh) *</label>
            <input type="number" step="0.1" id="currentBatteryLevel" class="form-control" placeholder="e.g. 150" required>
          </div>

          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Description / Specifications</label>
            <textarea id="description" class="form-control" rows="3" placeholder="Additional specifications, panel model, inverter capacity..."></textarea>
          </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
          <a href="microgrids.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Create Microgrid Node</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/microgrid-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/sidebar.js"></script>

  <script>
    AuthGuard.requireRole(['MicrogridOperator', 'Admin']);
    renderAppLayout('microgrids', 'Create Microgrid Node');

    async function handleCreate(e) {
      e.preventDefault();

      const payload = {
        name: document.getElementById('name').value,
        location: document.getElementById('location').value,
        status: document.getElementById('status').value,
        latitude: parseFloat(document.getElementById('latitude').value),
        longitude: parseFloat(document.getElementById('longitude').value),
        capacity: parseFloat(document.getElementById('capacity').value),
        batteryCapacity: parseFloat(document.getElementById('batteryCapacity').value),
        currentBatteryLevel: parseFloat(document.getElementById('currentBatteryLevel').value),
        description: document.getElementById('description').value,
        isActive: document.getElementById('status').value === 'Active'
      };

      try {
        await MicrogridApi.createMicrogrid(payload);
        ApiClient.showToast('Microgrid registered successfully!', 'success');
        setTimeout(() => window.location.href = 'microgrids.html', 1000);
      } catch (err) {
        ApiClient.showToast(err.message || 'Failed to create microgrid', 'error');
      }
    }
  </script>
</body>
</html>
