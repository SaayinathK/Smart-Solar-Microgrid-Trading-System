<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Capacity Management - Smart Microgrid Platform</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/tables.css">
</head>
<body>

  <div id="app-layout-wrapper">
    <div class="card" style="margin-bottom: 1.5rem;">
      <h2>Energy Capacity Management</h2>
      <p style="color: var(--text-secondary); margin-top: 0.25rem;">
        Monitor generation capacity allocations across microgrids (Total, Available, Reserved, and Used Capacity).
      </p>
    </div>

    <!-- Capacity List -->
    <div id="capacity-list-container">
      <div class="card" style="text-align: center; padding: 2rem;">Loading capacity data...</div>
    </div>
  </div>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/microgrid-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/sidebar.js"></script>

  <script>
    AuthGuard.requireAuth();
    renderAppLayout('capacity', 'Energy Capacity Management');

    async function loadCapacityData() {
      const container = document.getElementById('capacity-list-container');

      try {
        const response = await MicrogridApi.getMicrogrids();
        const list = response.data || [];

        if (list.length === 0) {
          container.innerHTML = `<div class="card" style="text-align: center; padding: 2rem;">No microgrids registered.</div>`;
          return;
        }

        container.innerHTML = list.map(m => {
          const availPct = m.capacity > 0 ? (m.availableCapacity / m.capacity) * 100 : 0;
          const resPct = m.capacity > 0 ? (m.reservedCapacity / m.capacity) * 100 : 0;
          const usedPct = m.capacity > 0 ? (m.usedCapacity / m.capacity) * 100 : 0;

          return `
            <div class="card" style="margin-bottom: 1.5rem;">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <h3 style="margin: 0;">${m.name}</h3>
                  <span style="font-size: 0.85rem; color: var(--text-secondary);">${m.location}</span>
                </div>
                <span class="status-badge ${m.status === 'Active' ? 'status-active' : 'status-warning'}">${m.status}</span>
              </div>

              <!-- Progress Bar -->
              <div style="height: 16px; width: 100%; background: var(--bg-tertiary); border-radius: 8px; overflow: hidden; display: flex; margin-bottom: 1.25rem;">
                <div style="width: ${availPct}%; background: var(--accent-primary);" title="Available: ${m.availableCapacity} kWh"></div>
                <div style="width: ${resPct}%; background: var(--accent-amber);" title="Reserved: ${m.reservedCapacity} kWh"></div>
                <div style="width: ${usedPct}%; background: var(--accent-indigo);" title="Used: ${m.usedCapacity} kWh"></div>
              </div>

              <!-- Legend / Stats -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem;">
                <div style="border-left: 3px solid var(--accent-primary); padding-left: 0.75rem;">
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Available Capacity</div>
                  <div style="font-weight: 700; font-size: 1.2rem;">${m.availableCapacity} kWh</div>
                </div>
                <div style="border-left: 3px solid var(--accent-amber); padding-left: 0.75rem;">
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Reserved Capacity</div>
                  <div style="font-weight: 700; font-size: 1.2rem;">${m.reservedCapacity} kWh</div>
                </div>
                <div style="border-left: 3px solid var(--accent-indigo); padding-left: 0.75rem;">
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Used Capacity</div>
                  <div style="font-weight: 700; font-size: 1.2rem;">${m.usedCapacity} kWh</div>
                </div>
                <div style="border-left: 3px solid var(--text-muted); padding-left: 0.75rem;">
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">Total Capacity</div>
                  <div style="font-weight: 700; font-size: 1.2rem;">${m.capacity} kWh</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="card" style="text-align: center; color: var(--accent-danger); padding: 2rem;">Failed to load capacity data.</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadCapacityData);
  </script>
</body>
</html>
