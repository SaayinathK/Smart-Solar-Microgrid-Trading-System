<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Availability - Smart Microgrid Platform</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/forms.css">
</head>
<body>

  <div id="app-layout-wrapper">
    <div class="card" style="margin-bottom: 1.5rem;">
      <h2>Available Solar Energy Slots</h2>
      <p style="color: var(--text-secondary); margin-top: 0.25rem;">
        Discover currently available clean solar energy slots across microgrid generation hubs.
      </p>

      <!-- Filter Bar -->
      <div style="display: flex; gap: 1rem; margin-top: 1.25rem; flex-wrap: wrap;">
        <input type="text" id="filter-location" class="form-control" placeholder="Filter by Location (e.g. Colombo)" style="flex: 1; min-width: 180px;">
        <input type="number" id="filter-min-energy" class="form-control" placeholder="Min kWh (e.g. 50)" style="width: 160px;">
        <button onclick="loadAvailability()" class="btn btn-primary">Search Energy</button>
      </div>
    </div>

    <!-- Available Energy Slots Table -->
    <div class="card">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Microgrid Hub</th>
              <th>Location</th>
              <th>Available Energy</th>
              <th>Time Window</th>
              <th>Price per Unit</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="availability-table-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">Loading available energy slots...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/microgrid-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/sidebar.js"></script>

  <script>
    AuthGuard.requireAuth();
    renderAppLayout('availability', 'Energy Availability');

    async function loadAvailability() {
      const location = document.getElementById('filter-location').value;
      const minEnergy = document.getElementById('filter-min-energy').value;
      const tbody = document.getElementById('availability-table-body');

      try {
        const response = await MicrogridApi.getEnergyAvailability({ location, minimumEnergy: minEnergy });
        const list = response.data || [];

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem;">No energy slots currently available.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(slot => `
          <tr>
            <td>
              <div style="font-weight: 600;">${slot.microgridName}</div>
              <div style="font-size: 0.75rem; color: var(--text-secondary);">Slot ID: ${slot.energySlotId}</div>
            </td>
            <td>${slot.location}</td>
            <td>
              <div style="font-weight: 700; color: var(--accent-primary);">${slot.availableAmount} kWh</div>
              <div style="font-size: 0.75rem; color: var(--text-secondary);">Total: ${slot.energyAmount} kWh</div>
            </td>
            <td>
              <div>${new Date(slot.startTime).toLocaleString()}</div>
              <div style="font-size: 0.75rem; color: var(--text-secondary);">to ${new Date(slot.endTime).toLocaleString()}</div>
            </td>
            <td>
              <div style="font-weight: 700; color: var(--accent-cyan);">$${slot.pricePerUnit} / kWh</div>
            </td>
            <td>
              <span class="status-badge status-active">${slot.status}</span>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--accent-danger); padding: 2rem;">Failed to load energy availability: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAvailability);
  </script>
</body>
</html>
