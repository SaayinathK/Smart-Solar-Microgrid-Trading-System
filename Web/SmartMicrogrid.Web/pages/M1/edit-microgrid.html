<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Microgrid - Smart Microgrid Platform</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/location-picker.css">
  <link rel="stylesheet" href="../../vendor/leaflet/leaflet.css">
</head>
<body>

  <div id="app-layout-wrapper">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <div style="margin-bottom: 1.5rem;">
        <h2>Edit Solar Microgrid Node</h2>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">
          Update microgrid node properties, generation capacity, battery capacity, and status.
        </p>
      </div>

      <form id="edit-microgrid-form" onsubmit="handleEdit(event)">
        <div class="form-grid microgrid-node-form-grid">
          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Microgrid Node Name *</label>
            <input type="text" id="name" class="form-control" required>
          </div>

          <div id="location-picker" class="location-picker"></div>

          <div class="form-group">
            <label class="form-label" for="location">Location / address *</label>
            <input type="text" id="location" class="form-control" placeholder="Street address, city, country" aria-describedby="location-status" required>
            <small id="location-status" class="location-address-status" role="status">Type an address to automatically find its latitude and longitude.</small>
          </div>

          <div class="form-group">
            <label class="form-label">Status *</label>
            <select id="status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Offline">Offline</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="latitude">Latitude (-90 to 90) *</label>
            <input type="number" step="any" min="-90" max="90" id="latitude" class="form-control" placeholder="e.g. 6.9271" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="longitude">Longitude (-180 to 180) *</label>
            <input type="number" step="any" min="-180" max="180" id="longitude" class="form-control" placeholder="e.g. 79.8612" required>
          </div>

          <div class="form-group">
            <label class="form-label">Generation Capacity (kW) *</label>
            <input type="number" step="0.1" id="capacity" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Available Battery Storage Slots *</label>
            <input type="number" min="0" step="1" id="batteryStorageSlots" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Battery Capacity (kWh) *</label>
            <input type="number" step="0.1" id="batteryCapacity" class="form-control" required>
          </div>

          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Description / Specifications</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
          </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
          <a href="microgrids.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../vendor/leaflet/leaflet.js"></script>
  <script src="../../js/common/openstreet-map.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/microgrid-api.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/sidebar.js"></script>
  <script src="../../js/common/location-picker.js"></script>

  <script>
    AuthGuard.requireRole(['MicrogridOperator', 'Admin']);
    renderAppLayout('microgrids', 'Edit Microgrid Node');
    const locationPicker = new LocationPicker(document.getElementById('location-picker'));

    const urlParams = new URLSearchParams(window.location.search);
    const microgridId = urlParams.get('id');

    async function loadData() {
      if (!microgridId) {
        alert('Invalid microgrid ID.');
        window.location.href = 'microgrids.html';
        return;
      }

      try {
        const res = await MicrogridApi.getMicrogridById(microgridId);
        const m = res.data;

        document.getElementById('name').value = m.name;
        locationPicker.setSavedLocation(m);
        document.getElementById('status').value = m.status;
        document.getElementById('capacity').value = m.capacity;
        document.getElementById('batteryStorageSlots').value = m.batteryStorageSlots || 0;
        document.getElementById('batteryCapacity').value = m.batteryCapacity;
        document.getElementById('description').value = m.description || '';
      } catch (err) {
        ApiClient.showToast('Failed to load microgrid details', 'error');
      }
    }

    async function handleEdit(e) {
      e.preventDefault();
      const selectedLocation = locationPicker.getSelection();
      if (!selectedLocation) return;

      const payload = {
        name: document.getElementById('name').value,
        ...selectedLocation,
        status: document.getElementById('status').value,
        capacity: parseFloat(document.getElementById('capacity').value),
        batteryStorageSlots: parseInt(document.getElementById('batteryStorageSlots').value, 10),
        batteryCapacity: parseFloat(document.getElementById('batteryCapacity').value),
        description: document.getElementById('description').value,
        isActive: document.getElementById('status').value === 'Active'
      };

      try {
        await MicrogridApi.updateMicrogrid(microgridId, payload);
        ApiClient.showToast('Microgrid updated successfully!', 'success');
        setTimeout(() => window.location.href = 'microgrids.html', 1000);
      } catch (err) {
        ApiClient.showToast(err.message || 'Update failed', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
