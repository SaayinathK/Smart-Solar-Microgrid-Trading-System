<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">

<body class="admin-reports-page">

  <div id="app-layout-wrapper">
    <section data-page-intro class="page-header"><div class="page-title"><h1>Administrative Reports</h1><p>Explore user accounts, roles, activity, and platform performance.</p></div></section>
    <section class="card management-panel report-filter-panel" aria-labelledby="report-filter-title">
      <div class="management-section-heading"><span class="management-section-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM14 3v5h5M10 12h5M10 16h5"/></svg></span><div><h2 id="report-filter-title">Build a report</h2><p>Choose a report type and narrow the results with optional filters.</p></div></div>
      <div class="report-filter-grid">
        <div class="management-field report-type-field"><label for="report-type">Report type</label><select id="report-type" class="form-select"><option value="users">User Summary Report</option><option value="roles">Role Distribution Report</option><option value="activity">System Activity Report</option><option value="platform">Platform Statistics Report</option></select></div>
        <div class="management-field"><label for="from-date">From date</label><input type="date" id="from-date" class="form-input"></div><div class="management-field"><label for="to-date">To date</label><input type="date" id="to-date" class="form-input"></div>
        <div class="management-field"><label for="role-filter">Account role</label><select id="role-filter" class="form-select"><option value="">All roles</option><option value="Admin">Admin</option><option value="MicrogridOperator">Microgrid operator</option><option value="Prosumer">Prosumer</option></select></div>
        <div class="management-field"><label for="status-filter">Account status</label><select id="status-filter" class="form-select"><option value="">All statuses</option><option value="Active">Active</option><option value="Inactive">Inactive</option><option value="Suspended">Suspended</option><option value="Pending">Pending</option></select></div>
      </div>
      <div class="report-filter-actions"><p id="report-filter-hint">Role and status filters apply to user summaries.</p><div><button type="button" id="csv-btn" class="btn btn-secondary">Export CSV</button><button type="button" id="generate-btn" class="btn btn-primary">Generate</button></div></div>
    </section>
    <div id="report-output" aria-live="polite" aria-busy="true"><div class="card report-message">Loading your report&hellip;</div></div>
  </div>

  <script src="../../js/config/api-config.js"></script>
  <script src="../../js/common/session.js"></script>
  <script src="../../js/common/theme.js"></script>
  <script src="../../js/common/auth.js"></script>
  <script src="../../js/common/page-template.js"></script>
  <script src="../../js/common/sidebar.js?v=20261016-logo-1"></script>
  <script src="../../js/api/api-client.js"></script>
  <script src="../../js/api/admin-api.js"></script>
  <script src="../../js/common/admin-ui.js"></script>
  <script src="../../js/m4/reports.js?v=20261016-layout-1"></script>
  <script>
    renderAppLayout('m4-reports', 'Administrative Reports');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
