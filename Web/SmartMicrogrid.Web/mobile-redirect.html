<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile App Required</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/interface.css">
  <link rel="stylesheet" href="css/spacing.css?v=20261016-1">
  <link rel="icon" type="image/png" href="assets/images/smart_micro.png">
  <link rel="apple-touch-icon" href="assets/images/smart_micro.png">
  <link rel="stylesheet" href="css/brand.css?v=20261016-1">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="glass-card auth-card" style="text-align: center;">
      <div class="auth-header">
        <h1>Continue on mobile</h1>
        <p>Prosumer accounts use the Android app</p>
      </div>
      
      <div style="margin: 2rem 0;">
        <svg style="width: 80px; height: 80px; color: var(--accent-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
      </div>

      <p style="margin-bottom: 2rem; color: var(--text-primary);">
        Sign in to the <strong>Smart Microgrid Android app</strong> to find energy, manage bookings, show delivery QR codes and track transfers. Prosumer sign-in is unavailable on the web.
      </p>

      <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="width: 100%;">
        Return to Home
      </button>
    </div>
  </div>

<footer class="footer"><div class="container"><span class="footer-brand"><img src="assets/images/smart_micro.png" alt="" aria-hidden="true" width="24" height="24">SmartMicrogrid</span><span>Connected energy communities</span><span>&copy; 2026</span></div></footer>
  <script src="js/config/api-config.js"></script>
  <script src="js/common/theme.js"></script>
  <script src="js/common/session.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/common/auth.js"></script>
  <script src="js/common/navbar.js?v=20261016-logo-1"></script>
  <script>

    // Expire legacy prosumer web sessions without signing staff out.
    if (SessionManager.getUserRole() === 'Prosumer') SessionManager.clearSession();
    renderNavbar();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
